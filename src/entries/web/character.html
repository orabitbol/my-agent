<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הדמות</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  /* The character that floats above the screen. It only draws: what the agent
     is doing comes from the server, and where it stands, glides and looks comes
     from the app. Every value comes from tokens.css. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; }

  .character {
    --mood: var(--accent);   /* the color of its light: changes with the state */
    --eye-open: 1;           /* 1 = open, near 0 = closed */
    --look-x: 0; --look-y: 0; /* where it looks: -1 to 1 on each axis */
    --voice: 0;              /* how loud it is speaking right now: 0 to 1 */
    position: relative;
    width: var(--character-size);
    height: var(--character-size);
    cursor: pointer;
    touch-action: none;
  }
  .character.dragging { cursor: grabbing; }

  /* The stage: a see-through sheet over a whole screen. The character is on it
     only while it glides from place to place, with a trail of light behind it. */
  body.stage { display: block; }
  body.stage .character, .ghost { position: absolute; inset-block-start: 0; left: 0; pointer-events: none; will-change: transform; }
  body.stage .character { visibility: hidden; }
  /* What it says when it turns to the user by itself: a speech bubble beside it. */
  #bubble {
    position: absolute; inset-block-start: 0; left: 0;
    max-width: var(--character-bubble);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-large);
    background: var(--surface-window);
    color: var(--label);
    box-shadow: var(--shadow-popover);
    font: var(--weight-medium) var(--text-message)/var(--lh-message) -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    unicode-bidi: plaintext;
    pointer-events: none;
    animation: appear var(--duration) var(--ease);
  }
  .ghost {
    width: var(--character-size); height: var(--character-size);
    border-radius: var(--radius-full);
    background: var(--mood);
    filter: blur(calc(var(--character-glow) / 2));
    opacity: 0;
  }
  /* Three layers of motion, one inside the other, so they never fight:
     .hopper settles after a landing, .floater breathes, .body reacts to the voice. */
  .hopper, .floater { position: absolute; inset: 0; }
  .hopper { transform-origin: 50% 100%; }
  .floater { animation: float var(--duration-breath) var(--ease) infinite; }

  /* Its light: a soft glow behind the body. */
  .glow {
    position: absolute; inset: 0;
    border-radius: var(--radius-full);
    background: var(--mood);
    filter: blur(var(--character-glow));
    opacity: calc(0.45 + var(--voice) * 0.4);
    transition: background var(--duration) var(--ease), opacity var(--duration-fast) var(--ease);
    animation: glow var(--duration-breath) var(--ease) infinite;
  }
  /* Rings of sound that leave it while it speaks. */
  .ring {
    position: absolute; inset: 0;
    border-radius: var(--radius-full);
    border: var(--character-ring) solid var(--mood);
    opacity: 0;
  }
  .body {
    position: absolute; inset: 0;
    border-radius: 46% 46% 44% 44% / 50% 50% 42% 42%;
    background: radial-gradient(circle at 35% 25%, color-mix(in srgb, var(--mood), var(--label-on-accent) var(--character-shine)), var(--mood) 70%);
    box-shadow: var(--shadow-control);
    transform: scale(calc(1 + var(--voice) * 0.07));
    transition: background var(--duration) var(--ease), transform var(--duration-fast) var(--ease);
  }
  .face {
    position: absolute; inset: 0;
    display: grid; place-items: center; align-content: center; gap: var(--space-2);
    transform: translate(calc(var(--look-x) * var(--character-look)), calc(var(--look-y) * var(--character-look)));
    transition: transform var(--duration-fast) var(--ease);
  }
  .eyes { display: flex; gap: var(--space-4); }
  .eye {
    width: var(--character-eye);
    height: calc(var(--character-eye) * 1.5);
    border-radius: var(--radius-full);
    background: var(--label-on-accent);
    transform: scaleY(var(--eye-open));
    transition: transform var(--duration-fast) var(--ease);
  }
  .character.blink .eye { transform: scaleY(0.1); }
  /* Pupils appear only while it can see the screen. No pupils: it sees nothing. */
  .eye { position: relative; }
  .eye::after {
    content: ""; position: absolute; inset-inline: 0; margin: auto; top: 30%;
    width: 50%; aspect-ratio: 1;
    border-radius: var(--radius-full);
    background: var(--character-pupil);
    opacity: 0;
    transition: opacity var(--duration) var(--ease);
  }
  .character.seeing .eye::after { opacity: 1; }
  /* The moment it looks at the screen: its eyes sweep from side to side once. */
  .character.glance .eyes { animation: scan calc(var(--duration-breath) / 4) var(--ease); }
  .mouth {
    width: var(--space-3); height: var(--space-1);
    border-radius: var(--radius-full);
    background: var(--label-on-accent);
    opacity: 0;
    transition: opacity var(--duration) var(--ease), height var(--duration-fast) var(--ease), width var(--duration-fast) var(--ease);
  }

  /* ---- one look per state ---- */
  .character[data-state="resting"]   { --mood: color-mix(in srgb, var(--accent), var(--gray) 55%); }
  .character[data-state="resting"] .glow { opacity: 0.3; }
  .character.asleep                  { --mood: var(--gray); --eye-open: 0.12; }
  .character.asleep .glow            { opacity: 0.15; }
  .character[data-state="ready"]     { --mood: var(--accent); }
  .character[data-state="listening"] { --mood: var(--accent); --eye-open: 1.15; }
  .character[data-state="hearing"]   { --mood: var(--green); --eye-open: 1.25; }
  .character[data-state="hearing"] .glow { animation-duration: calc(var(--duration-breath) / 4); opacity: 0.7; }
  .character[data-state="thinking"]  { --mood: var(--purple); --eye-open: 0.75; }
  .character[data-state="thinking"] .face { animation: ponder calc(var(--duration-breath) / 1.5) var(--ease) infinite; }
  .character[data-state="speaking"]  { --mood: var(--accent); }
  .character[data-state="speaking"] .mouth { opacity: 1; animation: talk calc(var(--duration-breath) / 9) var(--ease) infinite alternate; }
  .character[data-state="speaking"] .ring { animation: ring calc(var(--duration-breath) / 2) var(--ease) infinite; }
  .character[data-state="speaking"] .ring + .ring { animation-delay: calc(var(--duration-breath) / 4); }
  /* When the real loudness of the voice is known, the mouth follows it instead of a fixed rhythm. */
  .character.live[data-state="speaking"] .mouth {
    animation: none;
    height: calc(var(--space-1) + var(--voice) * var(--space-4));
    width: calc(var(--space-3) + var(--voice) * var(--space-1));
  }
  .character[data-state="approval"]  { --mood: var(--orange); --eye-open: 1.15; }
  .character[data-state="approval"] .floater { animation: nudge calc(var(--duration-breath) / 2) var(--ease) infinite; }
  /* Landing after a glide: it settles softly into its new place. */
  .character.land .hopper { animation: land calc(var(--duration) * 2) var(--ease); }

  /* Leaving for the desk device: it gathers itself and shrinks into a point.
     Arriving back: it grows out of a point, a little past its size, and settles. */
  .character.leaving .hopper  { animation: leave calc(var(--duration) * 2) var(--ease) forwards; transform-origin: 50% 50%; }
  .character.arriving .hopper { animation: arrive calc(var(--duration) * 2.4) var(--ease); transform-origin: 50% 50%; }
  @keyframes leave  { 25% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
  @keyframes arrive { 0% { transform: scale(0); opacity: 0; } 65% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes float  { 50% { transform: translateY(calc(var(--space-1) * -1)); } }
  @keyframes glow   { 50% { transform: scale(1.12); } }
  @keyframes ponder { 0%, 100% { transform: translate(calc(var(--space-1) * -1), calc(var(--space-1) * -1)); } 50% { transform: translate(var(--space-1), calc(var(--space-1) * -1)); } }
  @keyframes scan   { 25% { transform: translateX(calc(var(--character-look) * -1)); } 75% { transform: translateX(var(--character-look)); } }
  @keyframes talk   { to { height: var(--space-3); } }
  @keyframes ring   { from { transform: scale(0.9); opacity: 0.55; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes nudge  { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(calc(var(--space-2) * -1)); } }
  @keyframes appear { from { opacity: 0; transform: translateY(var(--space-1)); } }
  @keyframes land {
    0%   { transform: scale(1.08, 0.92); }
    55%  { transform: scale(0.98, 1.03); }
    100% { transform: scale(1, 1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hopper, .floater, .glow, .ring, .face, .eyes, .mouth { animation: none !important; }
  }
</style>
</head>
<body>
  <div id="trail"></div>
  <div id="bubble" role="status" hidden></div>
  <div class="character" id="character" data-state="resting" role="button" aria-label="הדמות של האייג'נט">
    <div class="hopper"><div class="floater">
      <div class="glow"></div>
      <div class="ring"></div><div class="ring"></div>
      <div class="body"></div>
      <div class="face">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
    </div></div>
  </div>
<script>
  const character = document.getElementById("character");
  // The app's side of the character (see character-preload.cts). Missing in a plain browser.
  const app = window.characterWindow;
  // The same page is used twice: in the small window where the character lives,
  // and on the stage it glides across.
  const onStage = location.pathname === "/stage";
  document.body.classList.toggle("stage", onStage);
  const LABELS = { resting: "נח", ready: "מוכן", listening: "מקשיב", hearing: "שומע אותך", thinking: "חושב", speaking: "מדבר", approval: "מחכה לאישור שלך" };

  // ---- what the agent is doing: the server holds it, this page only draws it ----
  function setState(state) {
    if (!(state in LABELS)) return;
    character.dataset.state = state;
    character.setAttribute("aria-label", "הדמות של האייג'נט: " + LABELS[state] + ". לחיצה מתחילה או מסיימת שיחה.");
    if (state !== "speaking") setVoice(0, false);
    if (state !== "resting") character.classList.remove("asleep");
    if (!onStage) app?.state(state);
  }
  // How loud the agent's voice is right now: its mouth and its light follow.
  function setVoice(level, live) {
    character.style.setProperty("--voice", String(level));
    character.classList.toggle("live", live);
  }
  // If the connection drops, the browser reconnects by itself.
  const events = new EventSource("/api/character");
  events.onmessage = (event) => setState(event.data);
  events.addEventListener("level", (event) => { if (character.dataset.state === "speaking") setVoice(Number(event.data) || 0, true); });
  // Vision: pupils while the agent may see the screen, and a quick look each time it does.
  events.addEventListener("vision", (event) => character.classList.toggle("seeing", event.data === "on"));
  events.addEventListener("glance", () => {
    character.classList.remove("glance");
    void character.offsetWidth; // start the animation again from the beginning
    character.classList.add("glance");
  });
  events.onerror = () => { setState("resting"); character.classList.remove("seeing"); };

  // ---- attention: where the character looks ----
  // A direction, -1 to 1 on each axis. Today the app sends the direction of the
  // mouse pointer. Later the same call can carry the direction of the user's
  // eyes from the device's camera, and nothing here has to change.
  function setAttention({ x, y }) {
    character.style.setProperty("--look-x", String(Math.max(-1, Math.min(1, x))));
    character.style.setProperty("--look-y", String(Math.max(-1, Math.min(1, y))));
  }

  // ---- what the app tells the character ----
  app?.listen((name, data) => {
    if (name === "attention") setAttention(data);
    if (name === "asleep") { character.classList.toggle("asleep", data === true); if (data === true) setAttention({ x: 0, y: 0 }); }
    if (name === "land") {
      character.classList.remove("land");
      void character.offsetWidth; // start the animation again from the beginning
      character.classList.add("land");
    }
    if (name === "leave" || name === "arrive") {
      character.classList.remove("leaving", "arriving", "land");
      void character.offsetWidth; // start the animation from the beginning
      character.classList.add(name === "leave" ? "leaving" : "arriving");
    }
    if (onStage && name === "fly") fly(data);
    if (onStage && name === "rest") rest();
    if (onStage && name === "say") say(data);
    if (onStage && name === "hush") bubble.hidden = true;
  });

  // ---- speaking up ----
  // The bubble sits above the character's head and opens toward the middle of
  // the screen, so it is never cut off at an edge.
  const bubble = document.getElementById("bubble");
  function say({ text, x, y, width }) {
    bubble.textContent = text;
    bubble.hidden = false;
    const gap = 12, half = 44; // room above the head, and half the character's width
    const box = bubble.getBoundingClientRect();
    const left = x > width / 2 ? x + half - box.width : x - half;
    const top = y - gap - box.height >= gap ? y - gap - box.height : y + 2 * half + gap;
    bubble.style.transform = `translate(${Math.max(gap, Math.min(width - box.width - gap, left))}px, ${top}px)`;
  }

  // ---- gliding across the stage ----
  // The path is a gentle arc. It starts slowly, speeds up and slows down again,
  // leans into the turn, and a trail of its own light follows and fades.
  const GHOSTS = 14, GHOST_GAP_MS = 26;
  const trail = document.getElementById("trail");
  const ghosts = onStage ? Array.from({ length: GHOSTS }, () => trail.appendChild(Object.assign(document.createElement("div"), { className: "ghost" }))) : [];
  let flight = 0;
  function fly({ from, control, to, startAt, duration }) {
    cancelAnimationFrame(flight);
    trail.style.setProperty("--mood", getComputedStyle(character).getPropertyValue("--mood"));
    character.style.visibility = "visible";
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const at = (time) => {
      const t = calm ? 1 : Math.max(0, Math.min(1, (time - startAt) / duration));
      const e = t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
      const a = (1 - e) * (1 - e), b = 2 * (1 - e) * e, c = e * e;
      return { x: a * from.x + b * control.x + c * to.x, y: a * from.y + b * control.y + c * to.y };
    };
    const frame = () => {
      const now = Date.now();
      const here = at(now), before = at(now - 16);
      const speed = Math.hypot(here.x - before.x, here.y - before.y);
      const lean = Math.max(-12, Math.min(12, (here.x - before.x) * 0.9));
      character.style.transform = `translate(${here.x}px, ${here.y}px) rotate(${lean}deg)`;
      setAttention({ x: (here.x - before.x) / 8, y: (here.y - before.y) / 8 }); // it looks where it is going
      ghosts.forEach((ghost, index) => {
        const past = at(now - (index + 1) * GHOST_GAP_MS);
        ghost.style.transform = `translate(${past.x}px, ${past.y}px) scale(${0.9 - index * 0.05})`;
        ghost.style.opacity = String(Math.min(1, speed / 6) * (0.34 - index * 0.022)); // the trail shows only while it moves fast
      });
      flight = requestAnimationFrame(frame);
    };
    frame();
  }
  function rest() {
    cancelAnimationFrame(flight);
    character.style.visibility = "hidden";
    for (const ghost of ghosts) ghost.style.opacity = "0";
  }

  // ---- what the user does to it ----
  //   a click:           start or stop a spoken conversation
  //   press and hold:    talk (the microphone is open while it is held)
  //   press and move:    drag it somewhere else
  const HOLD_MS = 280, DRAG_DISTANCE = 4;
  let press = null;
  character.addEventListener("pointerdown", (event) => {
    if (onStage || event.button !== 0 || press) return;
    character.setPointerCapture(event.pointerId);
    press = { x: event.screenX, y: event.screenY, dragging: false, holding: false };
    press.timer = setTimeout(() => { if (press && !press.dragging) { press.holding = true; app?.hold(true); } }, HOLD_MS);
  });
  character.addEventListener("pointermove", (event) => {
    if (!press || press.dragging) return;
    if (Math.hypot(event.screenX - press.x, event.screenY - press.y) < DRAG_DISTANCE) return;
    clearTimeout(press.timer);
    if (press.holding) app?.hold(false);
    press.holding = false;
    press.dragging = true;
    character.classList.add("dragging");
    app?.dragStart();
  });
  function release() {
    if (!press) return;
    clearTimeout(press.timer);
    if (press.dragging) app?.dragEnd();
    else if (press.holding) app?.hold(false);
    else app?.click();
    character.classList.remove("dragging");
    press = null;
  }
  character.addEventListener("pointerup", release);
  character.addEventListener("pointercancel", release);

  // ---- a small sign of life: it blinks ----
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  (function blink() {
    if (!character.classList.contains("asleep") && !still.matches) {
      character.classList.add("blink");
      setTimeout(() => character.classList.remove("blink"), 130);
    }
    setTimeout(blink, 2500 + Math.random() * 3500);
  })();
</script>
</body>
</html>
