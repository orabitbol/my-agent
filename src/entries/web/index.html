<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האייג'נט שלי</title>
<!-- Every color, size and spacing below comes from tokens.css. -->
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: var(--weight-regular) var(--text-body)/var(--lh-body) var(--font);
    color: var(--label);
    background: var(--surface-sidebar-solid);
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }
  /* Inside the desktop app the window itself is translucent. */
  .desktop body { background: transparent; }
  ::selection { background: var(--focus-ring); }
  :focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 1px; }
  svg { width: var(--icon-size); height: var(--icon-size); flex: none; }

  /* ---------- shared pieces ---------- */
  .toolbar {
    height: var(--toolbar-height); flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding-inline: var(--space-5);
    -webkit-app-region: drag;   /* the toolbar moves the window */
  }
  .toolbar h1 { margin: 0; font-size: var(--text-body); line-height: var(--lh-body); font-weight: var(--weight-semibold); }
  .button {
    font: inherit; color: var(--label); cursor: default;
    background: transparent; border: 0; border-radius: var(--radius-small);
    padding: var(--space-1) var(--space-2);
    transition: background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
    -webkit-app-region: no-drag;
  }
  .button:hover { background: var(--fill); }
  .button:active { background: var(--fill-strong); }
  .icon-button { display: grid; place-items: center; width: var(--control-size); height: var(--control-size); padding: 0; color: var(--label-secondary); }
  .icon-button:hover { color: var(--label); }
  .pill {
    flex: none; padding: 1px var(--space-2); border-radius: var(--radius-full);
    font-size: var(--text-subheadline); line-height: var(--lh-body); font-weight: var(--weight-medium);
    color: var(--pill-color); background: color-mix(in srgb, var(--pill-color) var(--tint), transparent);
  }
  .pill.accent { --pill-color: var(--accent); }
  .pill.green { --pill-color: var(--green); }
  .pill.orange { --pill-color: var(--orange); }
  .pill.quiet { --pill-color: var(--label-secondary); }

  /* ---------- chat column ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; height: 100vh; background: var(--surface-window); }
  .chat .toolbar { border-bottom: 1px solid var(--separator); }
  .messages { flex: 1; overflow-y: auto; padding: var(--space-6) var(--space-5); }
  .thread { max-width: var(--content-width); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-2); min-height: 100%; }

  /* The first screen: the agent's mark, a greeting and a few things to try. */
  .welcome { margin: auto; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; padding-bottom: var(--space-8); }
  .orb {
    width: var(--orb-size); height: var(--orb-size); border-radius: var(--radius-full);
    background: color-mix(in srgb, var(--accent) var(--tint), transparent);
    display: grid; place-items: center; margin-bottom: var(--space-2);
  }
  .orb::after {
    content: ""; width: 44%; height: 44%; border-radius: var(--radius-full); background: var(--accent);
    animation: breathe 3.2s var(--ease) infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.14); opacity: 0.85; } }
  .welcome h2 { margin: 0; font-size: var(--text-title-1); line-height: var(--lh-title-1); font-weight: var(--weight-semibold); }
  .welcome p { margin: 0; color: var(--label-secondary); font-size: var(--text-title-3); line-height: var(--lh-title-3); }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-3); }
  .suggestions .button {
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
    background: var(--fill); font-size: var(--text-body);
  }
  .suggestions .button:hover { background: var(--fill-strong); }

  .message {
    max-width: 78%;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-large);
    font-size: var(--text-message); line-height: var(--lh-message);
    user-select: text; cursor: text;
    animation: appear var(--duration) var(--ease);
  }
  .message.agent { align-self: flex-start; background: var(--bubble-agent); }
  .message.user  { align-self: flex-end; background: var(--accent); color: var(--label-on-accent); }
  .message.user + .message.agent, .message.agent + .message.user { margin-top: var(--space-2); }
  .message.error { background: transparent; color: var(--red); padding-inline: 0; }
  @keyframes appear { from { opacity: 0; transform: translateY(var(--space-1)); } }

  /* A sensitive action waiting for a yes or a no. */
  .approval {
    align-self: flex-start; max-width: 78%;
    display: flex; flex-direction: column; gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-large);
    background: var(--surface-control); box-shadow: var(--shadow-control);
    font-size: var(--text-message); line-height: var(--lh-message);
    animation: appear var(--duration) var(--ease);
  }
  .approval-label { font-size: var(--text-callout); line-height: var(--lh-callout); font-weight: var(--weight-semibold); color: var(--label-secondary); }
  .approval-actions { display: flex; gap: var(--space-2); }
  .approval .button { padding: var(--space-1) var(--space-4); font-weight: var(--weight-medium); background: var(--fill-strong); }
  .approval .button.primary { background: var(--accent); color: var(--label-on-accent); }
  .approval .button.primary:active { background: var(--accent-pressed); }
  .approval-status { font-size: var(--text-callout); line-height: var(--lh-callout); color: var(--label-secondary); }

  /* The direction rules. Every line decides its own direction from its first
     real letter: Hebrew lines run right to left, English lines left to right.
     Inside a line, the browser orders mixed Hebrew and English correctly. */
  .line { margin: 0; text-align: start; unicode-bidi: plaintext; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line:empty { height: var(--space-2); }
  code, pre { font-family: var(--font-mono); font-size: var(--text-body); direction: ltr; unicode-bidi: isolate; }
  code { background: var(--fill-strong); border-radius: var(--radius-small); padding: 1px var(--space-1); }
  .message.user code { background: var(--fill-on-accent); }
  pre.block {
    text-align: left; background: var(--surface-window); color: var(--label);
    border-radius: var(--radius-medium); padding: var(--space-3);
    margin: var(--space-2) 0; overflow-x: auto; white-space: pre; line-height: var(--lh-title-3);
  }
  .message a { color: var(--accent); text-decoration: none; font-weight: var(--weight-medium); overflow-wrap: anywhere; cursor: pointer; }
  .message a:hover { text-decoration: underline; }
  .message.user a { color: inherit; text-decoration: underline; }

  /* "Thinking": three soft dots inside an agent bubble. */
  .typing { display: flex; gap: var(--space-1); align-items: center; height: var(--lh-message); padding-inline: var(--space-1); }
  .typing span {
    width: var(--dot-size); height: var(--dot-size); border-radius: var(--radius-full); background: var(--label-tertiary);
    animation: pulse 1.2s var(--ease) infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: 0.35; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span, .message, .approval, .row, .orb::after { animation: none; } }

  /* ---------- message field ---------- */
  form { padding: var(--space-2) var(--space-5) var(--space-5); }
  .composer {
    max-width: var(--content-width); margin: 0 auto;
    display: flex; gap: var(--space-2); align-items: flex-end;
    background: var(--surface-control);
    border-radius: var(--radius-large);
    box-shadow: var(--shadow-control);
    padding: var(--space-1);
    padding-inline-start: var(--space-3);
    transition: box-shadow var(--duration-fast) var(--ease);
  }
  .composer:focus-within { box-shadow: 0 0 0 var(--focus-width) var(--focus-ring), var(--shadow-control); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit;
    font: inherit; font-size: var(--text-message); line-height: var(--lh-message);
    max-height: var(--field-max-height); padding: 3px 0; margin: 0;
    text-align: start; unicode-bidi: plaintext; cursor: text;
  }
  textarea:focus-visible { outline: none; }  /* the field around it shows the focus ring */
  textarea::placeholder { color: var(--label-tertiary); }
  .send {
    flex: none; width: var(--control-size); height: var(--control-size); padding: 0; border: 0; cursor: default;
    border-radius: var(--radius-full); background: var(--accent); color: var(--label-on-accent);
    display: grid; place-items: center;
    transition: background var(--duration-fast) var(--ease), opacity var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
  }
  .send:active { background: var(--accent-pressed); transform: scale(0.94); }
  .send:disabled { opacity: 0.3; }

  /* ---------- voice ----------
     While a spoken conversation is on, the message field becomes a status bar:
     a small orb that shows what the agent is doing, a line of text, and Stop. */
  .mic { flex: none; width: var(--control-size); height: var(--control-size); padding: 0; border-radius: var(--radius-full); display: grid; place-items: center; color: var(--label-secondary); }
  .mic:hover { color: var(--label); }
  .voice-bar { flex: 1; display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-size); }
  .voice-status { flex: 1; font-size: var(--text-message); line-height: var(--lh-message); color: var(--label-secondary); }
  .voice-orb {
    flex: none; width: var(--icon-size); height: var(--icon-size); border-radius: var(--radius-full);
    background: var(--orb-color, var(--gray)); transition: background var(--duration) var(--ease);
  }
  .voice-bar[data-state="listening"] .voice-orb { --orb-color: var(--accent); animation: breathe 3.2s var(--ease) infinite; }
  .voice-bar[data-state="hearing"] .voice-orb { --orb-color: var(--green); animation: breathe 0.7s var(--ease) infinite; }
  .voice-bar[data-state="thinking"] .voice-orb { --orb-color: var(--purple); animation: pulse 1.2s var(--ease) infinite; }
  .voice-bar[data-state="speaking"] .voice-orb { --orb-color: var(--accent); animation: breathe 0.5s var(--ease) infinite; }
  .voice-bar[data-state="approval"] .voice-orb { --orb-color: var(--orange); }
  .voice-bar[data-state="muted"] .voice-orb { --orb-color: var(--gray); }
  .voice-mode { flex: none; font-size: var(--text-callout); color: var(--label-secondary); background: var(--fill); }
  .voice-mode:hover { background: var(--fill-strong); color: var(--label); }
  .voice-mode[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: var(--accent); }
  .stop { background: var(--red); }
  .stop:active { background: var(--red); }
  .note { align-self: center; margin: var(--space-2) 0; color: var(--label-secondary); font-size: var(--text-callout); line-height: var(--lh-body); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .voice-orb { animation: none !important; } }

  /* ---------- sidebar ----------
     Built like System Settings: titled groups, each a rounded card of rows.
     A row is: a square colored icon, a title with an optional second line,
     and something at the far end (a status, a time, a small button). */
  aside {
    height: 100vh; display: flex; flex-direction: column; min-width: 0;
    background: var(--surface-sidebar-solid);
    border-inline-start: 1px solid var(--separator);
  }
  .desktop aside { background: var(--surface-sidebar); }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 var(--space-3) var(--space-5); }

  .group-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: var(--space-5) var(--space-2) var(--space-2);
    font-size: var(--text-subheadline); line-height: var(--lh-subheadline);
    font-weight: var(--weight-semibold); color: var(--label-secondary);
  }
  .group-title:first-child { margin-top: var(--space-1); }
  .group-title span { font-weight: var(--weight-regular); color: var(--label-tertiary); }
  .card { background: var(--surface-card); border-radius: var(--radius-medium); overflow: hidden; }

  .row {
    position: relative; display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-2) var(--space-3); min-height: var(--row-height);
    animation: appear var(--duration) var(--ease);
  }
  /* The hairline between rows starts after the icon, as in macOS lists. */
  .row + .row::before, .row + details.row-details::before, details.row-details + details.row-details::before, details.row-details + .row::before {
    content: ""; position: absolute; inset-block-start: 0; inset-inline: calc(var(--space-3) + var(--badge-size) + var(--space-3)) 0;
    border-top: 1px solid var(--separator);
  }
  .row.no-icon + .row.no-icon::before { inset-inline-start: var(--space-3); }
  .row.action { position: relative; }
  .row.action::before {
    content: ""; position: absolute; inset-block-start: 0; inset-inline: calc(var(--space-3) + var(--badge-size) + var(--space-3)) 0;
    border-top: 1px solid var(--separator);
  }
  .row-text { flex: 1; min-width: 0; }
  .row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--weight-medium); }
  .row-title.address { direction: ltr; text-align: right; unicode-bidi: isolate; user-select: text; }
  .row-sub { margin-top: 1px; color: var(--label-secondary); font-size: var(--text-subheadline); line-height: var(--lh-subheadline); }
  .row-sub.problem { color: var(--orange); }
  .row .button { flex: none; font-size: var(--text-callout); color: var(--accent); }
  .row .quiet-action { color: var(--label-secondary); opacity: 0; }
  .row:hover .quiet-action, .row .quiet-action:focus-visible { opacity: 1; }
  .row.action { color: var(--accent); cursor: default; width: 100%; border: 0; background: transparent; font: inherit; text-align: start; }
  .row.action:hover { background: var(--fill); }
  .row.action:disabled { color: var(--label-secondary); background: transparent; }
  .row.empty { color: var(--label-secondary); font-size: var(--text-callout); line-height: var(--lh-body); }

  /* The square icon at the start of a row. */
  .badge {
    position: relative; flex: none; display: grid; place-items: center;
    width: var(--badge-size); height: var(--badge-size); border-radius: var(--radius-icon);
    background: var(--badge-color); color: var(--label-on-accent);
  }
  .badge.blue { --badge-color: var(--accent); }
  .badge.orange { --badge-color: var(--orange); }
  .badge.purple { --badge-color: var(--purple); }
  .badge.green { --badge-color: var(--green); }
  .badge.red { --badge-color: var(--red); }
  .badge.gray { --badge-color: var(--gray); }
  .badge.soft { background: color-mix(in srgb, var(--badge-color) var(--tint), transparent); color: var(--badge-color); }

  /* waiting for a sign-in to finish in the browser */
  .connecting { padding: var(--space-3); border-top: 1px solid var(--separator); }
  .connecting p { margin: 0 0 var(--space-2); color: var(--label-secondary); font-size: var(--text-callout); line-height: var(--lh-body); }
  .connecting-actions { display: flex; gap: var(--space-1); flex-wrap: wrap; }
  .connecting-actions .button { background: var(--fill); font-size: var(--text-callout); }
  .connecting-actions .button:hover { background: var(--fill-strong); }
  .notice { margin: var(--space-2) var(--space-2) 0; color: var(--red); font-size: var(--text-callout); line-height: var(--lh-body); }

  /* memory rows: free text, so they wrap */
  .row.memory { align-items: flex-start; min-height: 0; }
  .row.memory .row-title { white-space: normal; overflow-wrap: anywhere; font-weight: var(--weight-regular); user-select: text; line-height: var(--lh-title-3); }
  .row.memory .icon-button { width: var(--lh-title-3); height: var(--lh-title-3); }
  .row.memory .icon-button:hover { color: var(--red); }

  /* activity rows open to show the technical details */
  details.row-details { position: relative; }
  details.row-details summary { list-style: none; cursor: default; }
  details.row-details summary::-webkit-details-marker { display: none; }
  details.row-details summary:hover { background: var(--fill); }
  details.row-details .row { animation: none; }
  .time { flex: none; color: var(--label-tertiary); font-size: var(--text-subheadline); font-variant-numeric: tabular-nums; }
  details.row-details pre {
    margin: 0; padding: 0 var(--space-3) var(--space-3);
    font-size: var(--text-subheadline); line-height: var(--lh-body); color: var(--label-secondary);
    white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; user-select: text; cursor: text;
  }

  @media (max-width: 780px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>

<main class="chat">
  <header class="toolbar">
    <h1>האייג'נט שלי</h1>
    <button class="button icon-button" id="reset" type="button" title="שיחה חדשה" aria-label="שיחה חדשה"></button>
  </header>

  <div class="messages" id="messages">
    <div class="thread" id="thread"></div>
  </div>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" dir="auto" placeholder="הודעה" aria-label="הודעה" autofocus></textarea>
      <button class="button mic" id="mic" type="button" title="שיחה קולית" aria-label="התחל שיחה קולית"></button>
      <button class="send" id="send" type="submit" aria-label="שלח" disabled></button>
      <div class="voice-bar" id="voice-bar" data-state="connecting" role="status" hidden>
        <span class="voice-orb"></span>
        <span class="voice-status" id="voice-status"></span>
        <button class="button voice-mode" id="voice-vision" type="button" aria-pressed="false"></button>
        <button class="button voice-mode" id="voice-mode" type="button"></button>
        <button class="send stop" id="voice-stop" type="button" title="סיים שיחה קולית" aria-label="סיים שיחה קולית"></button>
      </div>
    </div>
  </form>
</main>

<aside aria-label="חשבונות, זיכרון ופעילות">
  <header class="toolbar"></header>
  <div class="sidebar-scroll">
    <h2 class="group-title">חשבונות</h2>
    <div class="card">
      <div id="accounts"></div>
      <button class="row action" id="connect" type="button" hidden></button>
      <div class="connecting" id="connecting" hidden>
        <p>ממתין לאישור בדפדפן. אם הדף נסגר או נפתח בפרופיל הלא נכון, אפשר לפתוח שוב או להעתיק את הקישור לדפדפן אחר.</p>
        <div class="connecting-actions">
          <button class="button" id="connect-open" type="button">פתח שוב</button>
          <button class="button" id="connect-copy" type="button">העתק קישור</button>
          <button class="button" id="connect-cancel" type="button">בטל</button>
        </div>
      </div>
    </div>
    <p class="notice" id="connect-error" hidden></p>

    <h2 class="group-title">שירותים</h2>
    <div class="card" id="services"></div>

    <h2 class="group-title">זיכרון <span id="memory-count"></span></h2>
    <div class="card" id="memory"></div>

    <h2 class="group-title">פעילות</h2>
    <div class="card" id="calls"></div>
  </div>
</aside>

<script>
  // Inside the desktop app the window is translucent, so the styles differ a little.
  if (navigator.userAgent.includes("Electron")) document.documentElement.classList.add("desktop");

  // ---- icons: simple line shapes, drawn here, in the color of whatever holds them ----
  const svg = (paths) =>
    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
  const ICONS = {
    person: svg('<circle cx="8" cy="5.4" r="2.6"/><path d="M2.9 13.6c.5-2.5 2.5-3.9 5.1-3.9s4.6 1.4 5.1 3.9"/>'),
    briefcase: svg('<rect x="2.2" y="4.8" width="11.6" height="8.4" rx="1.8"/><path d="M5.9 4.8V3.9c0-.8.6-1.4 1.4-1.4h1.4c.8 0 1.4.6 1.4 1.4v.9M2.2 8.6h11.6"/>'),
    video: svg('<rect x="1.8" y="4.2" width="8.6" height="7.6" rx="1.8"/><path d="m10.4 7 3.8-2.1v6.2L10.4 9"/>'),
    plus: svg('<path d="M8 3.2v9.6M3.2 8h9.6"/>'),
    close: svg('<path d="m4.2 4.2 7.6 7.6M11.8 4.2l-7.6 7.6"/>'),
    check: svg('<path d="m3.4 8.4 3 3 6.2-6.6"/>'),
    arrowUp: svg('<path d="M8 13V3M3.6 7.4 8 3l4.4 4.4"/>'),
    compose: svg('<path d="M13.2 8.6v3.2a1.8 1.8 0 0 1-1.8 1.8H4.2a1.8 1.8 0 0 1-1.8-1.8V4.6a1.8 1.8 0 0 1 1.8-1.8h3.2"/><path d="m10.9 2.4 2.7 2.7-5 5-3 .4.4-3z"/>'),
    clock: svg('<circle cx="8" cy="8" r="5.6"/><path d="M8 4.8V8l2.2 1.4"/>'),
    calendar: svg('<rect x="2.4" y="3.4" width="11.2" height="10" rx="1.8"/><path d="M2.4 6.8h11.2M5.4 2v2.6M10.6 2v2.6"/>'),
    people: svg('<circle cx="6" cy="5.6" r="2.2"/><path d="M1.8 13c.4-2.2 2-3.4 4.2-3.4s3.8 1.2 4.2 3.4"/><path d="M10.6 3.6a2.2 2.2 0 0 1 0 4.2M12 9.9c1.2.4 2 1.4 2.3 3"/>'),

  // Adds text to a line, turning [label](address) and plain web addresses into links.
  // Only http and https addresses become links; they open in the browser.
  function appendWithLinks(line, text) {
    const pattern = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"')\]]+)/g;
    let last = 0;
    for (const match of text.matchAll(pattern)) {
      if (match.index > last) line.append(text.slice(last, match.index));
      const link = document.createElement("a");
      link.href = match[2] ?? match[3];
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      if (match[1]) {
        link.textContent = match[1];
      } else {
        // A bare address is shown short, and always left to right.
        const shown = match[3].replace(/^https?:\/\//, "");
        link.textContent = shown.length > 42 ? shown.slice(0, 40) + "…" : shown;
        link.dir = "ltr";
      }
      link.title = link.href;
      line.append(link);
      last = match.index + match[0].length;
    }
    if (last < text.length) line.append(text.slice(last));
  }

  // Turns text into safe page elements. Each line becomes its own block so it
  // can choose its own direction. `code` and ``` blocks always run left to right.
  function render(text) {
    const fragment = document.createDocumentFragment();
    const parts = text.split(/```[^\n]*\n?([\s\S]*?)```/g);
    parts.forEach((part, index) => {
      if (index % 2 === 1) {
        const pre = element("pre", "block", part.replace(/\n$/, ""));
        fragment.append(pre);
        return;
      }
      if (part.trim() === "") return;
      for (const lineText of part.replace(/^\n+|\n+$/g, "").split("\n")) {
        const line = element("p", "line");
        line.dir = "auto";
        lineText.split(/`([^`\n]+)`/g).forEach((piece, i) => {
          if (i % 2 === 1) line.append(element("code", "", piece));
          else if (piece) appendWithLinks(line, piece);
        });
        fragment.append(line);
      }
    });
    return fragment;
  }

  // Reads a stream of JSON lines from the server, calling `onEvent` for each line.
  async function readEvents(response, onEvent) {
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) if (line) await onEvent(JSON.parse(line));
    }
  }

  // ---- voice: a spoken conversation, over WebRTC, directly with OpenAI ----
  const micButton = document.getElementById("mic");
  const voiceBar = document.getElementById("voice-bar");
  const voiceStatus = document.getElementById("voice-status");
  // Two ways to use the microphone:
  //   "push": the microphone is closed until the space bar is held. Nothing in
  //           the room is picked up by mistake. Best in an office.
  //   "open": the microphone is always open, like a phone call. Best in a quiet room.
  const voiceModeButton = document.getElementById("voice-mode");
  let voiceMode = "push";
  try { voiceMode = localStorage.getItem("voice-mode") === "open" ? "open" : "push"; } catch {}
  let holdingToTalk = false;
  // Vision: when on, the agent gets a picture of every screen at the moment the
  // user starts to speak. Off until the user switches it on.
  const visionButton = document.getElementById("voice-vision");
  let vision = false;
  try { vision = localStorage.getItem("voice-vision") === "on"; } catch {}

  const VOICE_STATES = {
    connecting: "מתחבר…",
    muted: "החזק את מקש הרווח, או לחץ והחזק את הדמות, ודבר.",
    listening: "מקשיב. אפשר לדבר.",
    hearing: "שומע אותך…",
    thinking: "חושב…",
    speaking: "מדבר. אפשר לקטוע אותי.",
    approval: "ממתין לאישור שלך בכפתור למעלה.",
  };
  const IDLE_LIMIT_MS = 90 * 1000;        // close after this much silence, to save cost
  const SESSION_LIMIT_MS = 20 * 60 * 1000; // and never run longer than this
  let voice = null;

  function setVoiceState(state) {
    // With the microphone closed, "listening" would be untrue.
    if (state === "listening" && voiceMode === "push" && !holdingToTalk) state = "muted";
    voiceBar.dataset.state = state;
    voiceStatus.textContent = VOICE_STATES[state];
    showCharacter({ connecting: "thinking", muted: "ready" }[state] ?? state);
  }
  // Opens or closes the microphone according to the mode and the space bar.
  function applyMicrophone() {
    const open = voiceMode === "open" || holdingToTalk;
    for (const track of voice?.stream?.getTracks() ?? []) track.enabled = open;
    voiceModeButton.textContent = voiceMode === "open" ? "מיקרופון פתוח" : "לחיצה לדיבור";
    voiceModeButton.title = voiceMode === "open" ? "המיקרופון פתוח כל הזמן. לחץ כדי לעבור לדיבור רק בהחזקת רווח." : "המיקרופון סגור עד שמחזיקים רווח. לחץ כדי להשאיר אותו פתוח.";
    if (voice && ["muted", "listening"].includes(voiceBar.dataset.state)) setVoiceState("listening");
  }
  function applyVision() {
    visionButton.textContent = vision ? "רואה את המסך" : "לא רואה את המסך";
    visionButton.title = vision ? "כשאתה מתחיל לדבר נשלחת תמונה של כל מסך. לחץ כדי לכבות." : "האייג'נט לא רואה את המסך. לחץ כדי שיראה אותו כשאתה מדבר.";
    visionButton.setAttribute("aria-pressed", String(vision));
    // The floating character shows that it can see, for as long as a conversation is on.
    post("/api/character/vision", { on: vision && voice !== null }).catch(() => {});
  }
  function setVision(on) {
    vision = on;
    try { localStorage.setItem("voice-vision", on ? "on" : "off"); } catch {}
    if (!on && voice) forgetScreens(voice);
    applyVision();
  }
  visionButton.addEventListener("click", () => { visionButton.blur(); setVision(!vision); });
  // Takes the pictures out of the conversation, so the agent no longer has them.
  function forgetScreens(session) {
    for (const { itemId } of session.screens.values()) sendVoice({ type: "conversation.item.delete", item_id: itemId });
    session.screens.clear();
  }
  // Hands the agent a current picture of every screen. Called when the user
  // starts to speak. Only the newest picture of each screen stays in the
  // conversation: the older one is removed, so the cost does not pile up.
  async function shareScreens(session) {
    if (!vision || session.sharing || session.channel?.readyState !== "open") return;
    session.sharing = true;
    try {
      // One message on this connection has a size limit, and the picture must fit in it.
      const limit = Math.floor(((session.pc.sctp?.maxMessageSize || 262144) - 2048) * 0.72);
      const response = await fetch("/api/screens?max=" + limit);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      if (voice !== session || !vision) return;
      for (const screen of body.screens) {
        const before = session.screens.get(screen.id);
        if (before?.image === screen.image) continue; // nothing changed on this screen
        if (before) sendVoice({ type: "conversation.item.delete", item_id: before.itemId });
        const itemId = "screen_" + (session.screenCount = (session.screenCount ?? 0) + 1);
        sendVoice({ type: "conversation.item.create", item: { id: itemId, type: "message", role: "user", content: [{ type: "input_text", text: screen.label }, { type: "input_image", image_url: screen.image }] } });
        session.screens.set(screen.id, { image: screen.image, itemId });
      }
    } catch (error) {
      if (voice === session) { setVision(false); addNote("הראייה כובתה: " + error.message); }
    } finally {
      session.sharing = false;
    }
  }
  voiceModeButton.addEventListener("click", () => {
    voiceMode = voiceMode === "open" ? "push" : "open";
    try { localStorage.setItem("voice-mode", voiceMode); } catch {}
    voiceModeButton.blur();
    applyMicrophone();
  });
  // Hold the space bar to talk. Releasing it closes the microphone again.
  function holdToTalk(event, down) {
    if (!voice || voiceMode !== "push" || event.code !== "Space") return;
    event.preventDefault(); // do not scroll, and do not "click" a focused button
    if (event.repeat) return;
    setHolding(down);
  }
  // The same thing from anywhere: the space bar here, or holding the floating character.
  function setHolding(down) {
    if (!voice || voiceMode !== "push" || holdingToTalk === down) return;
    holdingToTalk = down;
    applyMicrophone();
    if (down) void shareScreens(voice);
    // What happens next (thinking, speaking) arrives from the conversation itself.
    setVoiceState(down ? "hearing" : "listening");
  }
  window.addEventListener("keydown", (event) => holdToTalk(event, true));
  window.addEventListener("keyup", (event) => holdToTalk(event, false));
  window.addEventListener("blur", () => { if (holdingToTalk) { holdingToTalk = false; applyMicrophone(); } });
  function showVoiceUi(on) {
    voiceBar.hidden = !on;
    input.hidden = on;
    micButton.hidden = on;
    sendButton.hidden = on;
  }
  function addNote(text) {
    document.getElementById("welcome")?.remove();
    thread.append(element("div", "note", text));
    scrollToEnd();
  }
  const sendVoice = (event) => {
    if (voice && voice.channel.readyState === "open") voice.channel.send(JSON.stringify(event));
  };

  async function startVoice() {
    if (voice || busy) return;
    showVoiceUi(true);
    setVoiceState("connecting");
    const session = { tools: new Map(), bubbles: new Map(), screens: new Map(), started: Date.now(), active: Date.now(), working: 0 };
    voice = session;
    applyVision();
    try {
      session.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      session.pc = new RTCPeerConnection();
      session.audio = new Audio();
      session.audio.autoplay = true;
      session.pc.ontrack = (event) => { session.audio.srcObject = event.streams[0]; followVoiceLevel(session, event.streams[0]); };
      for (const track of session.stream.getTracks()) session.pc.addTrack(track, session.stream);
      holdingToTalk = false;
      applyMicrophone(); // in "push" mode the microphone starts closed
      document.activeElement?.blur();

      // All events (what was heard, what is said, tool requests) travel on this channel.
      session.channel = session.pc.createDataChannel("oai-events");
      session.channel.addEventListener("open", () => { if (voice === session) setVoiceState("listening"); });
      session.channel.addEventListener("message", (event) => { if (voice === session) onVoiceEvent(JSON.parse(event.data)); });
      session.pc.addEventListener("connectionstatechange", () => {
        if (voice === session && ["failed", "disconnected", "closed"].includes(session.pc.connectionState)) stopVoice("החיבור הקולי נותק.");
      });

      const offer = await session.pc.createOffer();
      await session.pc.setLocalDescription(offer);
      const response = await fetch("/api/voice/session", { method: "POST", headers: { "Content-Type": "application/sdp" }, body: offer.sdp });
      const answer = await response.json();
      if (!response.ok) throw new Error(answer.error);
      if (voice !== session) return; // stopped while connecting
      session.transcription = answer.transcription;
      await session.pc.setRemoteDescription({ type: "answer", sdp: answer.answerSdp });

      session.timer = setInterval(() => {
        if (voice !== session || session.working > 0) return;
        if (Date.now() - session.started > SESSION_LIMIT_MS) stopVoice("השיחה הקולית נסגרה אחרי 20 דקות.");
        else if (Date.now() - session.active > IDLE_LIMIT_MS) stopVoice("השיחה הקולית נסגרה אחרי שקט, כדי לחסוך בעלות.");
      }, 5000);
    } catch (error) {
      if (voice !== session) return;
      const denied = error && (error.name === "NotAllowedError" || error.name === "SecurityError");
      stopVoice(denied ? "אין גישה למיקרופון. צריך לאשר אותה בהגדרות המערכת, תחת פרטיות ואבטחה > מיקרופון." : "השיחה הקולית לא התחילה: " + error.message);
    }
  }

  // Measures how loud the agent's voice is while it speaks, a few times a second,
  // and passes it on, so the floating character's mouth moves with the real voice.
  function followVoiceLevel(session, stream) {
    try {
      session.audioContext = new AudioContext();
      const analyser = session.audioContext.createAnalyser();
      analyser.fftSize = 256;
      session.audioContext.createMediaStreamSource(stream).connect(analyser);
      const samples = new Uint8Array(analyser.fftSize);
      let last = 0;
      session.levelTimer = setInterval(() => {
        let level = 0;
        if (voiceBar.dataset.state === "speaking") {
          analyser.getByteTimeDomainData(samples);
          let sum = 0;
          for (const sample of samples) sum += ((sample - 128) / 128) ** 2;
          level = Math.min(1, Math.sqrt(sum / samples.length) * 5);
        }
        if (Math.abs(level - last) < 0.03) return;
        last = level;
        fetch("/api/character/level", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ level }) }).catch(() => {});
      }, 90);
    } catch {} // without it the character still talks, in a fixed rhythm
  }

  // The floating character: a click on it starts or stops the conversation,
  // and holding it down is the same as holding the space bar.
  const characterEvents = new EventSource("/api/character");
  characterEvents.addEventListener("poke", () => { if (voice) stopVoice(); else startVoice(); });
  characterEvents.addEventListener("hold", (event) => setHolding(event.data === "down"));
  // The agent turned to the user by itself (a meeting is about to start): keep it in the chat too.
  characterEvents.addEventListener("nudge", (event) => addNote(event.data));

  function stopVoice(note) {
    const session = voice;
    if (!session) return;
    voice = null;
    holdingToTalk = false;
    clearInterval(session.timer);
    clearInterval(session.levelTimer);
    session.audioContext?.close().catch(() => {});
    try { session.channel?.close(); } catch {}
    try { session.pc?.close(); } catch {}
    for (const track of session.stream?.getTracks() ?? []) track.stop();
    if (session.audio) session.audio.srcObject = null;
    // A bubble that was still waiting for its text is removed, not left empty.
    for (const bubble of session.bubbles.values()) if (bubble.querySelector(".typing")) bubble.remove();
    showVoiceUi(false);
    applyVision();
    showCharacter(busy ? "thinking" : "resting");
    if (note) addNote(note);
    refreshInput();
    input.focus();
  }

  // One bubble per spoken item, found again by the item's id as its text arrives.
  function voiceBubble(id, kind) {
    let bubble = voice.bubbles.get(id);
    if (!bubble) {
      bubble = addMessage(kind);
      voice.bubbles.set(id, bubble);
    }
    return bubble;
  }

  function onVoiceEvent(event) {
    const session = voice;
    session.active = Date.now();
    switch (event.type) {
      case "input_audio_buffer.speech_started":
        setVoiceState("hearing");
        // With an open microphone, this is the moment he starts to speak.
        if (voiceMode === "open") void shareScreens(session);
        break;
      case "input_audio_buffer.speech_stopped":
        setVoiceState("thinking");
        break;
      case "input_audio_buffer.committed":
        // He finished speaking. Keep his place in the conversation until the words arrive.
        if (session.transcription && event.item_id) {
          voiceBubble(event.item_id, "user").innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
        }
        break;
      case "conversation.item.input_audio_transcription.completed": {
        const bubble = voiceBubble(event.item_id, "user");
        if ((event.transcript ?? "").trim()) bubble.replaceChildren(render(event.transcript.trim()));
        else bubble.remove();
        break;
      }
      case "conversation.item.input_audio_transcription.failed":
        session.bubbles.get(event.item_id)?.remove();
        break;
      case "response.created":
        if (voiceBar.dataset.state !== "approval") setVoiceState("thinking");
        break;
      case "output_audio_buffer.started":
        setVoiceState("speaking");
        break;
      case "output_audio_buffer.stopped":
      case "output_audio_buffer.cleared":
        if (session.working === 0) setVoiceState("listening");
        break;
      case "response.output_audio_transcript.delta": {
        const bubble = voiceBubble(event.item_id, "agent");
        bubble.dataset.text = (bubble.dataset.text ?? "") + (event.delta ?? "");
        bubble.replaceChildren(render(bubble.dataset.text));
        scrollToEnd();
        break;
      }
      case "response.output_audio_transcript.done":
        if ((event.transcript ?? "").trim()) voiceBubble(event.item_id, "agent").replaceChildren(render(event.transcript.trim()));
        break;
      case "response.output_item.done":
        if (event.item?.type === "function_call") {
          const jobs = session.tools.get(event.response_id) ?? [];
          jobs.push(runVoiceTool(session, event.item));
          session.tools.set(event.response_id, jobs);
        }
        break;
      case "response.done": {
        // If the model asked for tools, give it all the results, then let it continue.
        const jobs = session.tools.get(event.response?.id);
        if (jobs) {
          session.tools.delete(event.response.id);
          Promise.all(jobs).then(() => {
            if (voice === session) sendVoice({ type: "response.create" });
          });
        }
        break;
      }
      case "error":
        console.error("voice error", event.error);
        if (event.error?.message) addNote("שגיאה בשיחה הקולית: " + event.error.message);
        break;
    }
  }

  // Runs one tool the voice model asked for, on our server, and hands back the result.
  async function runVoiceTool(session, item) {
    session.working += 1;
    let output = JSON.stringify({ error: "The tool could not be run." });
    try {
      const response = await fetch("/api/voice/tool", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: item.name, arguments: item.arguments }),
      });
      await readEvents(response, (eventData) => {
        session.active = Date.now();
        if (eventData.type === "tool") {
          onToolEvent(eventData);
          // He cannot hear a link, so put it on the screen.
          const link = eventData.ok && eventData.result && eventData.result.link;
          if (link) addMessage("agent", "[פתח ביומן](" + link + ")");
        }
        if (eventData.type === "approval") {
          if (voice === session) setVoiceState("approval");
          addApproval(eventData, null);
        }
        if (eventData.type === "result") output = eventData.output;
      });
    } catch (error) {
      output = JSON.stringify({ error: "Could not reach the agent's server: " + error.message });
    }
    session.working -= 1;
    if (voice === session) {
      setVoiceState("thinking");
      sendVoice({ type: "conversation.item.create", item: { type: "function_call_output", call_id: item.call_id, output } });
    }
  }

  micButton.addEventListener("click", startVoice);
  document.getElementById("voice-stop").addEventListener("click", () => stopVoice());

  // ---- the message field ----
  function refreshInput() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
    sendButton.disabled = busy || input.value.trim() === "";
    micButton.disabled = busy;
  }
  input.addEventListener("input", refreshInput);

  // Enter sends, Shift+Enter adds a new line.
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;

    addMessage("user", text);
    input.value = "";
    busy = true;
    showCharacter("thinking");
    refreshInput();

    const pending = addMessage("agent");
    pending.setAttribute("aria-label", "חושב");
    pending.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    const show = (kind, content) => {
      pending.className = "message " + kind;
      pending.removeAttribute("aria-label");
      pending.replaceChildren(render(content));
      scrollToEnd();
    };

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!response.ok || !response.body) throw new Error("השרת החזיר שגיאה " + response.status);

      // Read the stream event by event: tool calls first, then the reply.
      let finished = false;
      await readEvents(response, (eventData) => {
        if (eventData.type === "tool") onToolEvent(eventData);
        if (eventData.type === "approval") { addApproval(eventData, pending); showCharacter("approval"); }
        if (eventData.type === "reply") { show("agent", eventData.text); finished = true; }
        if (eventData.type === "error") { show("agent error", eventData.message); finished = true; }
      });
      if (!finished) show("agent error", "החיבור נסגר לפני שהגיעה תשובה.");
    } catch (error) {
      show("agent error", "לא הצלחתי להגיע לשרת: " + error.message);
    } finally {
      busy = false;
      if (!voice) showCharacter("resting");
      refreshInput();
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    stopVoice();
    await fetch("/api/reset", { method: "POST" });
    showWelcome();
    input.focus();
  });
</script>
</body>
</html>
